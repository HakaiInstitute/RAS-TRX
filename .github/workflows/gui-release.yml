name: Create Release

on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+a[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+b[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+rc[0-9]+'

permissions: { }

jobs:
  build-binaries:
    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Get tag
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          echo "tag=$tag" >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          version: "0.5.26"
          enable-cache: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install Linux dependencies
        if: ${{ runner.os == 'Linux' }}
        run: >
          sudo apt-get install
          '^libxcb.*-dev'
          libx11-xcb-dev
          libglu1-mesa-dev
          libxrender-dev
          libxi-dev
          libxkbcommon-dev
          libxkbcommon-x11-dev

      - name: Install dependencies
        env:
          TAG: ${{ env.tag }}
        run: |
          uv version "$TAG"
          uv sync

      - name: Build Linux GUI Executable
        if: ${{ runner.os == 'Linux' }}
        env:
          TAG: ${{ env.tag }}
        run: >
          uv run pyinstaller
          --onefile
          --collect-all rasterio
          --collect-all pyproj
          --collect-all numpy
          --icon="src/ras_trx/resources/ras-trx.ico"
          --add-data="src/ras_trx/resources/ras-trx.ico:resources"
          --add-data="src/ras_trx/resources/*.ui:resources"
          "--name=RAS-TRX-v${TAG}-linux"
          src/ras_trx/__main__.py

      - name: Build Windows GUI Executable
        if: ${{ runner.os == 'Windows' }}
        env:
          TAG: ${{ env.tag }}
        run: >
          uv run pyinstaller
          --onefile
          --windowed
          --collect-all rasterio
          --collect-all pyproj
          --collect-all numpy
          --icon="src\ras_trx\resources\ras-trx.ico"
          --add-data="src\ras_trx\resources\ras-trx.ico;resources"
          --add-data="src\ras_trx\resources\*.ui;resources"
          "--name=RAS-TRX-v${TAG}-win64.exe"
          src/ras_trx/__main__.py

      - name: Archive release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.os }}-dist
          path: dist

  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Get tag
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          echo "tag=$tag" >> $GITHUB_ENV

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.tag }}
        run: |
          prerelease_flag=""
          title_suffix=""
          if echo "$TAG" | grep -qE 'a[0-9]+$'; then
            prerelease_flag="--prerelease"
            title_suffix=" (Alpha)"
          elif echo "$TAG" | grep -qE 'b[0-9]+$'; then
            prerelease_flag="--prerelease"
            title_suffix=" (Beta)"
          elif echo "$TAG" | grep -qE 'rc[0-9]+$'; then
            prerelease_flag="--prerelease"
            title_suffix=" (Release Candidate)"
          fi
          gh release create "v${TAG}" \
            --title "v${TAG}${title_suffix}" \
            --draft \
            --generate-notes \
            $prerelease_flag \
            artifacts/windows-latest-dist/* \
            artifacts/ubuntu-latest-dist/*
