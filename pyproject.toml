[project]
name = "ras-trx"
version = "0.0.1"
description = "Convert raster DEM coordinates between various ITRF realizations and NAD83 CSRS."
authors = [
    { name = "Santiago Gonzalez Arriola", email = "santiago@hakai.org" },
    { name = "Taylor Denouden", email = "taylor.denouden@hakai.org" },
]
requires-python = ">=3.10,<4,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "rasterio>=1.3.11,<2",
    "pydantic>=2.1.1,<3",
    "pyproj>=3.4.0,<4",
    "csrspy>=0.6.0,<0.7",
    "pyqt6>=6.4.0,<7",
    "pyinstaller==6.10.0",
    "requests>=2.28.1,<3",
]

[project.scripts]
ras-trx = "ras_trx.__main__:main"

[project.urls]
Repository = "https://github.com/HakaiInstitute/RAS-TRX"

[dependency-groups]
test = [
    "pytest>=7.2.0,<8"
]
dev = [
    "ruff>=0.6.6,<0.7",
    "pre-commit>=3.8.0,<4",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"
