[tool.poetry]
name = "ras-trx"
version = "0.0.0"
description = "Convert raster DEM coordinates between various ITRF realizations and NAD83 CSRS."
authors = [
    "Santiago Gonzalez Arriola <santiago@hakai.org>",
    "Taylor Denouden <taylor.denouden@hakai.org>",
]
repository = "https://github.com/HakaiInstitute/RAS-TRX"

packages = [
    { include = "ras_trx" },
]

[tool.poetry.dependencies]
python = "^3.9,<3.12"
rasterio = "^1.3.11"
pydantic = "^2.1.1"
pyproj = "^3.4.0"
csrspy = "^0.6.0"
pyqt6 = "^6.4.0"
pyinstaller = "6.10.0"
requests = "^2.28.1"

[tool.poetry.group.test.dependencies]
pytest = "^7.2.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6.6"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
